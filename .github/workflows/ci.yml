name: CodeRipple CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coderipple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  checks:
    name: Lint, typecheck, build, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts pnpm@12.14.0
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Smoke test the compiled CLI
        run: node dist/cli/index.js analyze fixtures/basic-project
      - run: pnpm test

  integration:
    name: Neo4j integration and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts pnpm@12.14.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Docker is available
        run: docker info --format '{{.ServerVersion}}'
      - run: pnpm test:integration
      - name: Measure all benchmark stages with Neo4j
        run: pnpm --silent benchmark --neo4j > "$RUNNER_TEMP/benchmark.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coderipple-benchmark
          path: ${{ runner.temp }}/benchmark.json
          if-no-files-found: error

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Audit the lockfile
        run: |
          npm install --global --ignore-scripts pnpm@12.14.0
          pnpm audit --audit-level high
      - name: Scan commits for secrets
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          range="$HEAD_SHA"
          if [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --log-opts="$range" /repo
